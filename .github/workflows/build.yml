name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch vendored dependencies
        run: python build/fetch_vendor.py

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller==6.22.3 pillow

      - name: Build exe
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\vendor
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name SaveGrab --icon assets/app.ico --add-data "assets;assets" main.py

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "manual" }
          Compress-Archive -Path dist\SaveGrab\* -DestinationPath "SaveGrab_${tag}_win64.zip"
          Get-Item "SaveGrab_${tag}_win64.zip" | Select-Object Name, Length

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SaveGrab_*_win64.zip
          generate_release_notes: false

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SaveGrab-win64
          path: SaveGrab_*_win64.zip
